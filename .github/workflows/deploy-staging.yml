name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        # Always deploy main, even if the checkout was left on another branch
        # for testing (a force-pushed branch otherwise breaks `git pull`).
        working-directory: /home/george/docker-config/golfmapper3
        run: |
          git fetch origin
          git checkout main
          git pull --ff-only origin main

      - name: Build frontend
        working-directory: /home/george/docker-config/golfmapper3/frontend
        run: |
          export NVM_DIR="/home/george/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          # npm ci installs from the lockfile without rewriting it, so the
          # checkout stays clean for the next pull.
          npm ci
          npm run build:stage

      - name: Build and deploy
        working-directory: /home/george/docker-config/golfmapper3
        run: |
          docker compose -f docker-compose-stage.yml build --no-cache
          docker compose -f docker-compose-stage.yml up -d

      - name: Verify
        # The container needs a few seconds after "Started" to finish `uv run`
        # and boot uvicorn, so poll the health check instead of reading the
        # logs immediately.
        run: |
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' gm3-stage-backend)" != "true" ]; then
              echo "Container is not running"
              docker logs gm3-stage-backend --tail 50
              exit 1
            fi
            if curl -fsS --max-time 5 http://localhost:8005/healthy; then
              echo
              echo "Healthy after ~$((i * 2))s"
              docker logs gm3-stage-backend --tail 20
              exit 0
            fi
            sleep 2
          done
          echo "Health check did not pass within 120s"
          docker logs gm3-stage-backend --tail 50
          exit 1
