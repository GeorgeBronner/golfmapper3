[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golfmapper3"
version = "0.2.0"
description = "golfmapper3 Backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143",
    "uvicorn>=0.54",
    "pydantic>=2.14",
    "email-validator>=2.3",
    "httpx>=0.28",
    "geopy>=2.5",
    "SQLAlchemy>=2.1",
    "starlette>=1.8",
    "bcrypt>=5.0",
    "sentry-sdk[fastapi]>=2.72",
    "python-dotenv>=1.2.4",
    "fastapi-pagination>=0.16.1",
    "psycopg2-binary>=2.9.13",
    "python-multipart>=0.0.32",
    "certifi",
    "pydantic-settings>=2.15",
    "slowapi>=0.1.10",
    "mailtrap>=2.11",
    "prometheus-fastapi-instrumentator>=8.1",
    "pyjwt>=2.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["B008"]  # Depends() in defaults is idiomatic FastAPI

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # standalone dev tools with embedded HTML/prompt strings

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "ruff>=0.17",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "httpx2>=2.13",
]
