[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golfmapper3"
version = "0.2.0"
description = "golfmapper3 Backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.103,<0.137",  # 0.137 adds _IncludedRouter, incompatible with prometheus-fastapi-instrumentator 8.0.0
    "uvicorn>=0.23",
    "pydantic>=2.3",
    "httpx>=0.28",
    "geopy",
    "SQLAlchemy>=1.4",
    "starlette",
    "bcrypt",
    "folium",
    "dotenv",
    "sentry-sdk[fastapi]",
    "python-dotenv>=0.19",
    "fastapi-pagination>=0.8",
    "psycopg2-binary",
    "python-multipart",
    "certifi",
    "pydantic-settings>=2.14",
    "slowapi>=0.1",
    "mailtrap>=2.0",
    "prometheus-fastapi-instrumentator>=8.0",
    "pyjwt>=2.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["B008"]  # Depends() in defaults is idiomatic FastAPI

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # standalone dev tools with embedded HTML/prompt strings

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=7.0",
    "pytest-asyncio",
]
